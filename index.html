<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zac Truelove</title>
    <meta name="description" content="Zac Truelove — Data Engineer and SQL Server specialist based in Chicago.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zactruelove.com/">
    <meta property="og:title" content="Zac Truelove">
    <meta property="og:description" content="Data Engineer and SQL Server specialist based in Chicago.">
    <meta property="og:image" content="https://zactruelove.com/assets/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
        /* Applied before first paint so light-mode users get no dark flash */
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/light-mode.css">
    <style>
        /* Landing-page-only rules. The full site's styles.css is left intact
           so restoring the previous index.html needs no other changes. */
        body { overflow: hidden; }

        .landing-contact {
            margin-top: 3.5rem;
            display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap;
            font-family: var(--font-mono);
            font-size: 0.8125rem; letter-spacing: 0.12em;
            opacity: 0; animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
        }
        .landing-contact a {
            color: var(--text-3); text-decoration: none;
            padding-bottom: 0.3rem; border-bottom: 1px solid var(--hairline);
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        .landing-contact a:hover,
        .landing-contact a:focus-visible { color: var(--text); border-bottom-color: var(--text-3); }

        .landing-toggle {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 10;
            opacity: 0; animation: fadeIn 1s ease 1.6s forwards;
        }

        @media (max-width: 600px) {
            body { overflow-y: auto; }
            .landing-contact { gap: 1.25rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .landing-contact, .landing-toggle { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle landing-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5 A6.5 6.5 0 0 1 8 14.5 Z" fill="currentColor"/></svg>
    </button>

    <main class="hero">
        <div class="hero-canvas"><canvas id="spheres"></canvas></div>
        <div class="hero-inner">
            <p class="eyebrow">Data Engineer · SQL Server Specialist</p>
            <h1>Zac Truelove</h1>
            <div class="landing-contact">
                <a href="mailto:zactruelove@gmail.com">zactruelove@gmail.com</a>
                <a href="https://www.linkedin.com/in/ztruelove/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
